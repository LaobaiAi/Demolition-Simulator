name: blender_render_server
kind: atomic-mcp
description: "Animation rendering and preview via Blender — OpenGL viewport rendering to MP4, plus fast Workbench white-model preview"
start_mode: lazy

health:
  timeout_ms: 1200000

tools:
  - name: render_animation
    description: "Render demolition animation to MP4 video using OpenGL viewport (H.264, 1280x720, 24fps)"
    tags: [blender, render, video]
  - name: render_preview
    description: "Fast white-model preview render using Workbench engine (~0.1s/frame, 640x360)"
    tags: [blender, preview, quick]

depends_on:
  servers:
    - blender_environment_server
