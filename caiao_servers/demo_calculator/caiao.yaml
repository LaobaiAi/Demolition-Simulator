# caiao.yaml — CAIAO Server manifest
# Every CAIAO Server MUST have a caiao.yaml manifest.

# ── Identity ─────────────────────────────────────────────────────────────
name: demo_calculator
version: 0.1.0
kind: atomic-mcp
description: "Basic arithmetic demonstration server — add, subtract, multiply, divide"
status: active
since: "2026-05-25"

# ── Lifecycle ─────────────────────────────────────────────────────────────
start_mode: eager

# ── Command ───────────────────────────────────────────────────────────────
command:
  python: auto
  args: ["server.py"]
  cwd: "."
  env: {}

# ── Health ────────────────────────────────────────────────────────────────
health:
  timeout_ms: 5000
  restart_on_crash: false
  max_restarts: 3
  health_check_interval_s: 0

# ── Tools ─────────────────────────────────────────────────────────────────
tools:
  - name: add
    description: "Add two numbers together"
    tags: [arithmetic, addition]

  - name: subtract
    description: "Subtract the second number from the first"
    tags: [arithmetic, subtraction]

  - name: multiply
    description: "Multiply two numbers"
    tags: [arithmetic, multiplication]

  - name: divide
    description: "Divide the first number by the second"
    tags: [arithmetic, division]

# ── Capabilities ────────────────────────────────────────────────────────
capabilities: [arithmetic, demo]

# ── Dependencies ─────────────────────────────────────────────────────────
dependencies:
  python: []
  system: []
