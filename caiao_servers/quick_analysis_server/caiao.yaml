# caiao.yaml — CAIAO Server manifest
# Every CAIAO Server MUST have a caiao.yaml manifest.

# ── Identity ─────────────────────────────────────────────────────────────
name: quick_analysis_server
version: 0.1.0
kind: merged
description: "Pipeline A — 2D quick structural analysis: generate frame, run anaStruct analysis, identify critical column in one atomic call"
status: active
since: "2026-05-25"

# ── Lifecycle ─────────────────────────────────────────────────────────────
start_mode: eager

# ── Command ───────────────────────────────────────────────────────────────
command:
  python: auto
  args: ["server.py"]
  cwd: "."
  env: {}

# ── Health ────────────────────────────────────────────────────────────────
health:
  timeout_ms: 5000
  restart_on_crash: false
  max_restarts: 3
  health_check_interval_s: 0

# ── Tools ─────────────────────────────────────────────────────────────────
tools:
  - name: quick_analysis
    description: "Pipeline A: Generate a 2D frame, run anaStruct linear analysis, and identify the critical column — all in one atomic call. Accepts the same parameters as generate_frame and returns structure + analysis + critical_element in a single response"
    tags: [pipeline, 2d, generation, analysis, critical-element, merged, anastruct]

# ── Imports (merged servers only) ─────────────────────────────────────────
imports:
  - module: frame_generator.core
    symbols: [FrameGenerator, FrameGeneratorConfig]
  - module: anastruct_server.server
    symbols: [_analyze_structure, _select_critical_element]

# ── Capabilities ────────────────────────────────────────────────────────
capabilities: [2d-analysis, pipeline, generation, critical-element-identification, merged, anastruct]

# ── Dependencies ─────────────────────────────────────────────────────────
dependencies:
  python: [anastruct]
  system: []
