name: visual_demolition
kind: composite
description: "Visual demolition pipeline — generate structure, optionally run FEM analysis, plan demolition, create animation"
status: active
since: "2026-06-05"

input_schema:
  type: object
  required: [num_bays_x, num_stories, span_x_m, story_height_m, mode]
  properties:
    num_bays_x:
      type: integer
      description: "Number of bays in X direction"
    num_stories:
      type: integer
      description: "Number of stories"
    span_x_m:
      type: number
      description: "Span length in meters"
    story_height_m:
      type: number
      description: "Story height in meters"
    steel_grade:
      type: string
      description: "Steel grade (Q235, Q355, etc.)"
    mode:
      type: string
      description: "mechanics (FEM analysis + animation) or topology (animation only)"
      enum: [mechanics, topology]
    strategy:
      type: string
      description: "Demolition strategy (top_down / bottom_up / sequential)"
    effects_preset:
      type: string
      description: "Visual effects preset (standard / dramatic / minimal)"
    speed:
      type: number
      description: "Animation speed multiplier"

tools:
  - name: run_visual_demolition
    description: "Full visual demolition pipeline — structure generation, optional FEM analysis, demolition planning, animation creation, physics init"
    tags: [pipeline, demolition, animation, mechanics, topology]

pipeline:
  - server: frame_generator
    tool: generate_frame
    map_result: structure
    modes: [mechanics, topology]

  - server: anastruct_server
    tool: analyze_frame
    input_map: {structure: structure}
    map_result: analysis
    modes: [mechanics]

  - server: anastruct_server
    tool: select_critical_element
    input_map: {structure: structure, analysis_result: analysis}
    map_result: critical_element
    modes: [mechanics]

  - server: planning_server
    tool: plan_demolition_sequence
    input_map: {structure: structure, strategy: strategy}
    map_result: demolition_plan
    modes: [mechanics, topology]

  - server: animation_control_server
    tool: create_timeline
    input_map: {demolition_plan: demolition_plan, effects_preset: effects_preset}
    map_result: timeline
    modes: [mechanics, topology]

  - server: animation_control_server
    tool: sequence_to_animation_data
    input_map: {demolition_sequence: timeline, speed: speed}
    map_result: animation_data
    modes: [mechanics, topology]

  - server: animation_control_server
    tool: generate_effects_config
    input_map: {preset: effects_preset, structure: structure}
    map_result: effects_config
    modes: [mechanics, topology]

  - server: physics_server
    tool: init_physics_scene
    input_map: {structure: structure, animation_data: animation_data}
    map_result: physics_scene
    modes: [mechanics, topology]
