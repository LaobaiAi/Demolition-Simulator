# caiao.yaml — CAIAO Server manifest
# Every CAIAO Server MUST have a caiao.yaml manifest.

# ── Identity ─────────────────────────────────────────────────────────────
name: opensees_server
version: 0.1.0
kind: atomic-mcp
description: "High-fidelity 2D frame analysis via OpenSeesPy — static linear elastic with higher accuracy than fast solvers"
status: active
since: "2026-05-25"

# ── Lifecycle ─────────────────────────────────────────────────────────────
start_mode: lazy

# ── Command ───────────────────────────────────────────────────────────────
command:
  python: "venv/Scripts/python.exe"
  args: ["server.py"]
  cwd: "."
  env: {}

# ── Health ────────────────────────────────────────────────────────────────
health:
  timeout_ms: 5000
  restart_on_crash: false
  max_restarts: 3
  health_check_interval_s: 0

# ── Tools ─────────────────────────────────────────────────────────────────
tools:
  - name: high_fidelity_analysis
    description: "Run high-fidelity static analysis on a 2D frame structure using OpenSees. Returns node displacements and element forces. More accurate than fast analysis but slower"
    tags: [analysis, 2d, opensees, high-fidelity, verification]

# ── Capabilities ────────────────────────────────────────────────────────
capabilities: [2d-analysis, high-fidelity, verification, opensees]

# ── Dependencies ─────────────────────────────────────────────────────────
dependencies:
  python: [openseespy]
  system: []
