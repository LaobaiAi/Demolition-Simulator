name: steam_turbine_demolition
version: 0.2.0
kind: composite
description: "Steam turbine industrial building — build Blender model, apply demolition animation, render video"
status: active
since: "2026-06-06"

input_schema:
  type: object
  required: [mode, building_type]
  properties:
    mode:
      type: string
      description: "Pipeline mode — topology only (no FEM analysis)"
      enum: [topology]
    building_type:
      type: string
      description: "Building type — must be steam_turbine for this pipeline"
      enum: [steam_turbine]
      default: steam_turbine
    strategy:
      type: string
      description: "Demolition strategy (informational; animate stage uses the built-in sequence)"
    effects_preset:
      type: string
      description: "Visual effects preset (informational)"
    speed:
      type: number
      description: "Animation speed multiplier (informational)"

tools:
  - name: run_steam_turbine_demolition
    description: "Full steam turbine demolition pipeline — build model, apply demolition animation, render video"
    tags: [pipeline, demolition, blender, industrial, animation]

pipeline:
  - server: blender_build_server
    tool: build_frame_model
    label: Building steam turbine model
    modes: [topology]
    defaults:
      building_type: steam_turbine
    map_result: build

  - server: blender_pipeline_server
    tool: run_pipeline_stage
    label: Applying demolition animation
    modes: [topology]
    defaults:
      stage: turbine_animate
    input_map:
      blend_input: build.blend_file
      output_dir: build.output_dir
    map_result: animate

  - server: blender_pipeline_server
    tool: run_pipeline_stage
    label: Rendering demolition video
    modes: [topology]
    defaults:
      stage: render
    input_map:
      blend_input: animate.blend_file
      output_dir: animate.output_dir
    map_result: render
