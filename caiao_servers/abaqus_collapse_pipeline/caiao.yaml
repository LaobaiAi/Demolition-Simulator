name: abaqus_collapse_pipeline
kind: composite
description: "Complete Abaqus factory collapse simulation — load project config and run end-to-end collapse analysis"

input_schema:
  type: object
  required: [config]
  properties:
    config:
      type: object
      description: "Full project configuration with building, collapse, job, and materials sections"
    project_dir:
      type: string
      description: "Project directory for output files (defaults to current working directory)"

tools:
  - name: run_abaqus_collapse
    description: "Execute complete factory collapse simulation in Abaqus — from model building to result extraction"
    tags: [abaqus, pipeline, collapse]

pipeline:
  - server: abaqus_session_server
    tool: setup_collapse
    map_result: collapse
