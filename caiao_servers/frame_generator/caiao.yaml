# caiao.yaml — CAIAO Server manifest
# Every CAIAO Server MUST have a caiao.yaml manifest.

# ── Identity ─────────────────────────────────────────────────────────────
name: frame_generator
version: 0.1.0
kind: atomic-mcp
description: "Parametric 2D and 3D frame structure generation from simple parameters or natural language"
status: active
since: "2026-05-25"

# ── Lifecycle ─────────────────────────────────────────────────────────────
start_mode: eager

# ── Command ───────────────────────────────────────────────────────────────
command:
  python: auto
  args: ["server.py"]
  cwd: "."
  env: {}

# ── Health ────────────────────────────────────────────────────────────────
health:
  timeout_ms: 5000
  restart_on_crash: false
  max_restarts: 3
  health_check_interval_s: 0

# ── Tools ─────────────────────────────────────────────────────────────────
tools:
  - name: generate_frame
    description: "Generate a 2D frame structure for structural analysis. Returns nodes, elements, loads, supports compatible with anaStruct/OpenSees"
    tags: [generation, 2d, frame, parametric]

  - name: generate_frame_3d
    description: "Generate a 3D frame with columns, beams, slabs, and Three.js-ready objects. Used for 3D visualization and Unity export"
    tags: [generation, 3d, frame, visualization, unity-export]

  - name: generate_from_text
    description: "Generate a 2D frame structure from a natural-language description"
    tags: [generation, 2d, nlp, natural-language]

  - name: list_materials
    description: "List all available steel and concrete grades with their material properties (E, fy/fc, density)"
    tags: [materials, steel, concrete, reference]

# ── Capabilities ────────────────────────────────────────────────────────
capabilities: [2d-generation, 3d-generation, parametric, natural-language, materials-reference, steel, concrete]

# ── Dependencies ─────────────────────────────────────────────────────────
dependencies:
  python: []
  system: []
