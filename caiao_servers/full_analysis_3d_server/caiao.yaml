# caiao.yaml — CAIAO Server manifest
# Every CAIAO Server MUST have a caiao.yaml manifest.

# ── Identity ─────────────────────────────────────────────────────────────
name: full_analysis_3d_server
version: 0.1.0
kind: atomic-mcp
description: "3D full structural analysis pipeline — generate 3D frame, convert to UnifiedFrame, run PyNite FEM, identify critical column"
status: active
since: "2026-05-25"

# ── Lifecycle ─────────────────────────────────────────────────────────────
start_mode: lazy

# ── Command ───────────────────────────────────────────────────────────────
command:
  python: auto
  args: ["server.py"]
  cwd: "."
  env: {}

# ── Health ────────────────────────────────────────────────────────────────
health:
  timeout_ms: 5000
  restart_on_crash: false
  max_restarts: 3
  health_check_interval_s: 0

# ── Tools ─────────────────────────────────────────────────────────────────
tools:
  - name: full_analysis_3d
    description: "Generate a 3D frame, convert to UnifiedFrame, run PyNite 3D FEM analysis, and identify the critical column — all in one atomic call. Returns geometry, structure (UnifiedFrame topology), analysis results, and critical element"
    tags: [pipeline, 3d, generation, analysis, pynite, critical-element, unified-frame]

# ── Capabilities ────────────────────────────────────────────────────────
capabilities: [3d-analysis, pipeline, generation, pynite, unified-frame, critical-element-identification]

# ── Dependencies ─────────────────────────────────────────────────────────
dependencies:
  python: [Pynite]
  system: []
